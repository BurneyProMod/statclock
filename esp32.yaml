esphome:
  name: faceit-clock

esp32:
  variant: esp32c3
  board: esp32-c3-devkitm-1
  framework:
    type: arduino

logger:

# Wi-Fi details live in secrets.yaml (see secrets.example.yaml).
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# Wireless firmware updates after the first USB flash.
ota:
  - platform: esphome
    password: !secret ota_password

# Lets the Go program set the Elo with:
#   POST http://faceit-clock.local/number/elo/set?value=2009
web_server:
  port: 80

number:
  - platform: template
    name: "elo"
    id: elo
    optimistic: true
    restore_value: true # keep showing the last Elo after a reboot
    min_value: 0
    max_value: 9999
    step: 1

spi:
  clk_pin: GPIO5
  mosi_pin: GPIO4

font:
  - file: "gfonts://Press Start 2P"
    id: matrix_font
    size: 8

display:
  - platform: max7219digit
    id: max_display
    cs_pin: GPIO6
    num_chips: 4
    intensity: 8
    update_interval: 250ms
    lambda: |-
      // Hand-drawn 3x5 digits. Each row is 3 bits, left to right.
      static const uint8_t DIGITS[10][5] = {
        {0b111,0b101,0b101,0b101,0b111}, // 0
        {0b010,0b110,0b010,0b010,0b111}, // 1
        {0b111,0b001,0b111,0b100,0b111}, // 2
        {0b111,0b001,0b111,0b001,0b111}, // 3
        {0b101,0b101,0b111,0b001,0b001}, // 4
        {0b111,0b100,0b111,0b001,0b111}, // 5
        {0b111,0b100,0b111,0b101,0b111}, // 6
        {0b111,0b001,0b001,0b001,0b001}, // 7
        {0b111,0b101,0b111,0b101,0b111}, // 8
        {0b111,0b101,0b111,0b001,0b111}, // 9
      };
      static const uint8_t DASH[5] = {0b000,0b000,0b111,0b000,0b000};

      auto draw_glyph = [&](int x, int y, const uint8_t rows[5]) {
        for (int r = 0; r < 5; r++) {
          for (int c = 0; c < 3; c++) {
            if (rows[r] & (1 << (2 - c))) {
              it.draw_pixel_at(x + c, y + r, esphome::display::COLOR_ON);
            }
          }
        }
      };

      // Show "----" until the first Elo arrives.
      std::string text = std::isnan(id(elo).state) ? "----" : std::to_string((int) id(elo).state);

      // Center the text: each glyph is 3 pixels wide plus 1 pixel of space.
      const int start_y = 1;
      int x = (it.get_width() - ((int) text.size() * 4 - 1)) / 2;

      it.fill(esphome::display::COLOR_OFF);
      for (char ch : text) {
        draw_glyph(x, start_y, ch == '-' ? DASH : DIGITS[ch - '0']);
        x += 4;
      }
